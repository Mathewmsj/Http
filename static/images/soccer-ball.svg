<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="120" height="120">
  <!-- 足球背景 -->
  <circle cx="256" cy="256" r="240" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
  
  <!-- 黑色五边形 -->
  <polygon points="256,80 310,120 290,185 222,185 202,120" fill="#000000"/>
  
  <!-- 周围的五边形和六边形图案 -->
  <polygon points="310,120 370,140 365,205 290,185" fill="#000000"/>
  <polygon points="202,120 142,140 147,205 222,185" fill="#000000"/>
  
  <polygon points="365,205 395,270 355,325 290,300" fill="#000000"/>
  <polygon points="147,205 117,270 157,325 222,300" fill="#000000"/>
  
  <polygon points="355,325 320,395 256,380 240,325" fill="#000000"/>
  <polygon points="157,325 192,395 256,380 272,325" fill="#000000"/>
  
  <!-- 白色六边形轮廓 -->
  <path d="M 222,185 L 202,120 L 142,140 L 147,205 L 117,270 L 157,325 L 222,300 Z" 
        fill="none" stroke="#000000" stroke-width="3"/>
  <path d="M 290,185 L 310,120 L 370,140 L 365,205 L 395,270 L 355,325 L 290,300 Z" 
        fill="none" stroke="#000000" stroke-width="3"/>
</svg>

