<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员信息</title>
</head>
<body>
    <span class="text-20 font-bold" data-name="王易宁">姓名：王易宁</span>
    <span class="text-20 font-bold" data-name="张翼">姓名：张翼</span>
    <span class="text-20 font-bold" data-name="灯">姓名：灯</span>
    <span class="text-20 font-bold" data-name="木桨">姓名：木桨</span>

    <div id="content" class="content"></div>
    <script>
        const data = {"王易宁": "1", "张翼": "2", "灯": "3", "木桨": "6"}
        const spans = document.querySelectorAll('span');
        spans.forEach(span => {
            span.addEventListener('click', () => {
                const content = document.getElementById('content');
                content.innerHTML = data[span.dataset.name];
            });
        });
    </script>
</body>
</html>
