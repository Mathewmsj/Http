<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生列表</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        #loading {
            color: #666;
        }
        .student {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>学生列表</h1>
    <p id="loading">正在加载数据...</p>
    <div id="students-container"></div>

    <script>
        // 页面加载完成后，从后端获取数据
        window.onload = function() {
            console.log('开始加载学生数据...');
            
            // 使用 fetch API 发送 AJAX 请求
            fetch('/students')
                .then(response => response.json())
                .then(data => {
                    console.log('收到数据:', data);
                    
                    // 隐藏加载提示
                    document.getElementById('loading').style.display = 'none';
                    
                    // 渲染学生列表
                    renderStudents(data);
                })
                .catch(error => {
                    console.error('加载失败:', error);
                    document.getElementById('loading').textContent = '加载失败: ' + error;
                });
        };

        // 渲染学生列表
        function renderStudents(students) {
            const container = document.getElementById('students-container');
            
            // 遍历每个学生，动态创建 DOM
            students.forEach(student => {
                // 创建学生div
                const div = document.createElement('div');
                div.className = 'student';
                
                // 设置内容
                div.innerHTML = 
                    '<strong>姓名：</strong>' + student.name + '<br>' +
                    '<strong>年龄：</strong>' + student.age + '<br>' +
                    '<strong>专业：</strong>' + student.major + '<br>' +
                    '<strong>年级：</strong>' + student.grade + '<br>' +
                    '<strong>邮箱：</strong>' + student.email;
                
                // 添加到容器
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
